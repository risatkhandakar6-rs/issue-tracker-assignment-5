<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- daisy+tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <style>
    * {
      font-family: "Geist", sans-serif;
    }
  </style>
</head>

<body class="bg-[#f8fcfc]">
  <header class="bg-[#FFFFFF]">
    <div class="navbar bg-base-100 shadow-sm flex justify-between">
      <div class="flex items-center gap-3">
        <img src="assets/github-logo.png" alt="" class="w-8 h-8 shrink-0">
        <a class="font-bold " href="">GitHub Issue Tracker</a>
      </div>
      <div class="flex gap-2">
        <input type="text" placeholder="Search" class="input input-bordered w-24 md:w-auto" />
        <div class="dropdown dropdown-end">
          <button class="font-bold btn btn-primary">search</button>
        </div>
      </div>

    </div>
    </div>
    </div>
  </header>





  <section class="max-w-[1110px] mx-auto">
    <div class=" bg-[#FFFFFF] py-8 mt-7 ">
      <div class="flex gap-5 pl-17 sm:pl-5  ">
        <button id="btn-all" class="btn btn-outline btn-primary ">All</button>
        <button id="btn-open" class="btn btn-outline btn-primary ">Open</button>
        <button id="btn-closed" class="btn btn-outline btn-primary">Closed</button>
      </div>
    </div>





    <div class="flex bg-[#FFFFFF] mt-7 py-8 justify-between px-5">
      <div class="flex gap-1  sm:gap-2 items-center">
        <div>
          <img src="assets/Aperture.png" alt="" class="rounded-full bg-[#ECE4FF] p-2">
        </div>
        <div>
          <h1 id="total-issues" class="font-bold text-2xl">50 Issues</h1>
          <p class="text-[10px] sm:text-[20px]">Track and manage your project issues</p>
        </div>
      </div>
      <div class="flex items-center gap-1 sm:gap-3">
        <img src="assets/Open-Status.png" alt="" class="w- h-4">
        <h1>Open</h1>
        <img src="assets/Closed- Status .png" alt="" class="w-4 h-4">
        <h1>Closed</h1>
      </div>
    </div>

    <span id="loading" class="loading loading-spinner loading-xl mx-auto flex  hidden"></span>

    <div id="issues-container" class="mt-5 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3  ">

    </div>

  </section>

</body>
<script src="script.js"></script>

</html>
